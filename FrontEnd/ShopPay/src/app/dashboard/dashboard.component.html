<main class="dashboard-shell">
  <nav class="sidebar" aria-label="Primary navigation">
    <a class="brand" routerLink="/dashboard">
      <span class="brand-mark">S</span>
      <span>ShopPay</span>
    </a>

    <div class="nav-links">
      <a
        routerLink="/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Dashboard
      </a>
      <a routerLink="/dashboard/products" routerLinkActive="active">Products</a>
      <a href="#">Orders</a>
      <a href="#">Wallet</a>
      <a href="#">Customers</a>
      <a href="#">Settings</a>
    </div>
  </nav>

  <section class="main-panel">
    <header class="topbar">
      <div>
        <p class="eyebrow">Dashboard</p>
        <h1>Welcome, {{ displayName }}</h1>
      </div>

      <div class="header-actions">
        <button class="icon-button" type="button" aria-label="Notifications">
          <span class="bell" aria-hidden="true"></span>
          <span class="notification-dot" aria-hidden="true"></span>
        </button>
        <button
          class="icon-button relative"
          type="button"
          aria-label="Cart"
          (click)="toggleCart()">

          🛒

          @if(cartCount > 0) {
            <span
              class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full min-w-5 h-5 flex items-center justify-center">
              {{ cartCount }}
            </span>
          }

        </button>
        <button class="logout-button" type="button" (click)="logout()">Log Out</button>
      </div>
    </header>

    <router-outlet></router-outlet>
  </section>
  
</main>

@if(isCartOpen) {

  <div
    class="fixed inset-0 bg-black/30 z-40"
    (click)="closeCart()">
  </div>

  <div
    class="fixed top-0 right-0 h-full w-[420px] bg-white z-50 shadow-2xl overflow-y-auto">

    <app-cart-drawer
      (close)="closeCart()">
    </app-cart-drawer>

  </div>

}
