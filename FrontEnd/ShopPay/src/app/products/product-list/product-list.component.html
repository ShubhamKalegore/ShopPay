<div class="p-6">
    <div class="flex items-center justify-between gap-4 mb-6">
        <h1 class="text-3xl font-bold">
            Products
        </h1>

        <button
            type="button"
            (click)="openProductDialog()"
            class="flex items-center gap-2 bg-green-600 hover:bg-green-700 text-white px-5 py-3 rounded-lg shadow transition">

            <span class="text-xl leading-none">+</span>

            <span>Add Product</span>

        </button>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">

        @for(product of products; track product.productId) {

        <div class="bg-white rounded-lg shadow border p-4 hover:shadow-lg transition">

            <div class="flex items-center justify-between mb-3">
                <h2 class="text-lg font-semibold truncate">
                    {{ product.name }}
                </h2>

                <span class="text-xs bg-gray-100 px-2 py-1 rounded-full">
                    Stock: {{ product.stockQuantity }}
                </span>
            </div>

            <p class="text-sm text-gray-600 h-12 overflow-hidden">
                {{ product.description }}
            </p>

            <div class="mt-4 flex items-center justify-between">
                <span class="text-xl font-bold text-green-600">
                    ₹{{ product.price }}
                </span>
            </div>
            <button (click)="addToCart(product)" [disabled]="isOutOfStock(product)"
                class="mt-4 w-full py-2 rounded-md transition" [class.bg-green-600]="!isOutOfStock(product)"
                [class.hover:bg-green-700]="!isOutOfStock(product)" [class.text-white]="!isOutOfStock(product)"
                [class.bg-gray-400]="isOutOfStock(product)" [class.cursor-not-allowed]="isOutOfStock(product)">

                {{ isOutOfStock(product) ? 'Out Of Stock' : 'Add To Cart' }}

            </button>

        </div>

        }

    </div>
</div>

@if(isProductDialogOpen) {

  <div
    class="fixed inset-0 bg-black/50 z-[100]"
    (click)="closeProductDialog()">
  </div>

  <div
    class="fixed inset-0 flex items-center justify-center z-[101]">

    <div
      class="bg-white rounded-xl shadow-xl w-full max-w-2xl max-h-[90vh] flex flex-col"
      (click)="$event.stopPropagation()">

      <div class="flex justify-between items-center p-4 border-b">

        <h2 class="text-xl font-semibold">
          Add Product
        </h2>

        <button
          (click)="closeProductDialog()"
          class="text-2xl">
          ✕
        </button>

      </div>

      <div class="p-6 overflow-y-auto">

        <app-product-info
          (saveProduct)="saveProduct($event)">
        </app-product-info>

      </div>

    </div>

  </div>

}
