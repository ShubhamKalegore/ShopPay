<div class="p-6">

    <!-- Header -->
    <div class="flex items-center justify-between mb-6">

        <h1 class="text-3xl font-bold">
            Products
        </h1>

        <button type="button" (click)="openProductDialog()"
            class="flex items-center gap-2 bg-green-600 hover:bg-green-700 text-white px-5 py-3 rounded-lg shadow transition">

            <span class="text-xl">+</span>

            <span>Add Product</span>

        </button>

    </div>

    <!-- Products -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-3 gap-6">

        @for(product of products; track product.productId) {

        <div
            class="relative bg-white rounded-xl border border-gray-200 shadow hover:shadow-xl transition duration-300 overflow-hidden">

            <!-- Out Of Stock Ribbon -->
            @if(isOutOfStock(product)) {
            <div
                class="absolute top-5 -left-12 rotate-[-40deg] bg-red-600 text-white text-[11px] font-bold px-12 py-1 uppercase shadow-md z-20">
                Out Of Stock
            </div>
            }

            <div class="p-5" [class.opacity-60]="isOutOfStock(product)">

                <!-- Header -->
                <div class="flex items-center gap-2 mb-4">

                    <!-- Product Name -->
                    <h2 class="flex-1 min-w-0 text-lg font-semibold truncate" [title]="product.name">

                        {{ product.name }}

                    </h2>

                    <!-- Stock -->
                    <span
                        class="flex-shrink-0 bg-gray-100 text-gray-700 text-xs font-medium px-3 py-1 rounded-full whitespace-nowrap">

                        Stock: {{ product.stockQuantity }}

                    </span>

                    <!-- Edit -->
                    <button type="button" (click)="editProduct(product)" title="Edit Product"
                        class="flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-full hover:bg-yellow-100 transition">

                        ✏️

                    </button>

                    <!-- Delete -->
                    <button type="button" (click)="deleteProduct(product.productId)" title="Delete Product"
                        class="flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-full hover:bg-red-100 transition">

                        🗑️

                    </button>

                </div>

                <!-- Description -->
                <p class="text-sm text-gray-600 h-14 overflow-hidden leading-6 mb-5">

                    {{ product.description }}

                </p>

                <!-- Price -->
                <div class="mb-5">

                    <span class="text-3xl font-bold text-green-600">

                        ₹{{ product.price }}

                    </span>

                </div>

                <button type="button" (click)="isOutOfStock(product) ? notifyMe(product) : addToCart(product)"
                    class="w-full py-3 rounded-lg font-semibold transition" [class.bg-green-600]="!isOutOfStock(product)"
                    [class.hover:bg-green-700]="!isOutOfStock(product)" [class.text-white]="!isOutOfStock(product)"
                    [class.bg-blue-600]="isOutOfStock(product)" [class.hover:bg-blue-700]="isOutOfStock(product)"
                    [class.text-white]="isOutOfStock(product)">

                    {{ isOutOfStock(product) ? 'Notify Me' : 'Add To Cart' }}

                </button>

            </div>

        </div>

        }

    </div>

</div>

@if(isProductDialogOpen) {

<div class="fixed inset-0 bg-black/50 z-[100]" (click)="closeProductDialog()">
</div>

<div class="fixed inset-0 flex items-center justify-center z-[101]">

    <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl max-h-[90vh] flex flex-col"
        (click)="$event.stopPropagation()">

        <!-- Dialog Header -->
        <div class="flex items-center justify-between p-4 border-b">

            <h2 class="text-xl font-semibold">

                {{ isEditMode ? 'Edit Product' : 'Add Product' }}

            </h2>

            <button (click)="closeProductDialog()" class="text-2xl hover:text-red-600 transition">

                ✕

            </button>

        </div>

        <!-- Dialog Body -->
        <div class="p-6 overflow-y-auto">

            <app-product-info [product]="selectedProduct" [isEditMode]="isEditMode" (saveProduct)="saveProduct($event)">

            </app-product-info>

        </div>

    </div>

</div>

}
