<div class="h-full flex flex-col bg-white">

  <div class="flex items-center justify-between p-6 border-b">

    <h2 class="text-2xl font-bold">
      Shopping Cart
    </h2>

    <button
      (click)="closeDrawer()"
      class="text-2xl font-bold text-gray-500 hover:text-black">
      ✕
    </button>

  </div>

  <div class="flex-1 overflow-y-auto p-6">

    @if(cartItems.length === 0) {

      <div class="text-center text-gray-500 mt-10">
        Your cart is empty
      </div>

    } @else {

      <div class="space-y-4">

        @for(item of cartItems; track item.productId) {

          <div class="border rounded-lg p-4">

            <div class="flex justify-between items-start">

              <div>
                <h3 class="font-semibold text-lg">
                  {{ item.name }}
                </h3>

                <p class="text-green-600 font-bold mt-1">
                  ₹{{ item.price }}
                </p>
              </div>

              <button
                (click)="removeItem(item.productId)"
                class="text-red-500 font-bold">
                ✕
              </button>

            </div>

            <div class="flex items-center gap-3 mt-4">

              <button
                (click)="decreaseQuantity(item.productId)"
                class="w-8 h-8 rounded bg-gray-200">
                -
              </button>

              <span class="font-semibold">
                {{ item.quantity }}
              </span>

              <button
                (click)="increaseQuantity(item)"
                class="w-8 h-8 rounded bg-gray-200">
                +
              </button>

            </div>

          </div>

        }

      </div>

    }

  </div>

  <div class="border-t p-6 bg-white">

    <div class="flex justify-between mb-3">
      <span class="font-medium">Subtotal</span>
      <span class="font-bold">₹{{ subtotal }}</span>
    </div>

    <div class="flex justify-between mb-4">
      <span>Address</span>
      <button class="text-blue-600 text-sm">
        Add Default Address
      </button>
    </div>

    <button
      class="w-full bg-green-600 text-white py-3 rounded-lg hover:bg-green-700">
      Checkout
    </button>

  </div>

</div>
